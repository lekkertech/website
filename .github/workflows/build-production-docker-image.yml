name: Build and deploy production image

on:
  push:
    branches:
      - prod
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEPLOY_DIR: lekkertech

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value={{date 'YYYYMMDDHHmmss'}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          # The server's public host key (ssh-keyscan -t ed25519 <host>), pinned
          # with strict checking so a spoofed host cannot receive the secrets.
          # Refresh the secret if the server is rebuilt.
          SSH_HOST_KEY: ${{ secrets.PROD_SSH_HOST_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/prod.key
          printf '%s %s\n' "$SSH_HOST" "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<END
          Host prod
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/prod.key
            StrictHostKeyChecking yes
          END

      # Secrets travel over the SSH channel on stdin, never as command
      # arguments, so they do not appear in `ps` on the runner or the host.
      - name: Write compose file and environment on the host
        env:
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          SLACK_INVITE_URL: ${{ secrets.SLACK_INVITE_URL }}
        run: |
          ssh prod "mkdir -p ~/$DEPLOY_DIR"
          ssh prod "cat > ~/$DEPLOY_DIR/compose.yml" < compose-production.yml
          {
            printf 'RECAPTCHA_SITE_KEY=%s\n' "$RECAPTCHA_SITE_KEY"
            printf 'RECAPTCHA_SECRET_KEY=%s\n' "$RECAPTCHA_SECRET_KEY"
            printf 'SLACK_INVITE_URL=%s\n' "$SLACK_INVITE_URL"
          } | ssh prod "umask 077 && cat > ~/$DEPLOY_DIR/.env"

      - name: Pull the new image and restart what changed
        run: |
          ssh prod "cd ~/$DEPLOY_DIR && docker compose pull --quiet && docker compose up -d --remove-orphans && docker image prune -f"
