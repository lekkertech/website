name: Build and deploy production image

# Sends the application environment to the server, builds and pushes the
# image to GHCR, then posts to the server's pull hook so it applies the
# environment, pulls and restarts (see deploy/). No SSH. The last step
# watches the live site until it reports the SHA we just built, so a
# failed deploy shows up here as a red run.

on:
  push:
    branches:
      - prod
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SITE_URL: https://lekkertech.org.za/

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Delivered first so it is in place before the pull hook runs.
      # The body is signed with the env hook's secret the same way GitHub
      # signs its own deliveries; the daemon rejects anything else.
      - name: Send the environment to the server
        env:
          ENV_HOOK_SECRET: ${{ secrets.ENV_HOOK_SECRET }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          SLACK_INVITE_URL: ${{ secrets.SLACK_INVITE_URL }}
        run: |
          umask 077
          {
            printf 'RECAPTCHA_SITE_KEY=%s\n' "$RECAPTCHA_SITE_KEY"
            printf 'RECAPTCHA_SECRET_KEY=%s\n' "$RECAPTCHA_SECRET_KEY"
            printf 'SLACK_INVITE_URL=%s\n' "$SLACK_INVITE_URL"
          } > env.txt
          body="$(printf '{"env":"%s"}' "$(base64 -w0 env.txt)")"
          rm -f env.txt
          sig="$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$ENV_HOOK_SECRET" | sed 's/^.* //')"
          curl -fsS -m 60 -X POST "${SITE_URL}_hooks/env" \
            -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: sha256=$sig" \
            --data "$body"
          echo

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value={{date 'YYYYMMDDHHmmss'}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same signing pattern as the env hook. The server pulls latest and
      # restarts; we then poll until the public site serves this SHA.
      - name: Tell the server to pull
        env:
          PULL_HOOK_SECRET: ${{ secrets.PULL_HOOK_SECRET }}
        run: |
          body='{}'
          sig="$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$PULL_HOOK_SECRET" | sed 's/^.* //')"
          curl -fsS -m 60 -X POST "${SITE_URL}_hooks/pull" \
            -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: sha256=$sig" \
            --data "$body"
          echo

      - name: Wait for the site to serve this build
        run: |
          want="${{ github.sha }}"
          deadline=$((SECONDS + 300))
          while :; do
            got="$(curl -sS -m 10 -I -H 'Cache-Control: no-cache' "$SITE_URL" \
                   | tr -d '\r' | awk 'tolower($1)=="x-app-version:" {print $2}')"
            if [ "$got" = "$want" ]; then
              echo "Live: $got"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Site still serving '${got:-no version header}' after 5 minutes, wanted $want"
              exit 1
            fi
            echo "Serving '${got:-no version header}', waiting..."
            sleep 10
          done
