# Run the webhook receiver as an unprivileged user, on loopback only. nginx
# proxies /_hooks/deploy to it (see deploy/nginx). Installed as
# /etc/systemd/system/webhook.service.d/override.conf by deploy/server-setup.sh.
[Service]
User=webhook
Group=webhook
ExecStart=
ExecStart=/usr/bin/webhook -nopanic -ip 127.0.0.1 -port 9000 -hooks /etc/webhook.conf
