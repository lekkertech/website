# Shared-memory zone for rate limiting the deploy hook. It lives in its own
# file under /etc/nginx/conf.d because limit_req_zone is only allowed in the
# http context. Declaring it limits nothing on its own; only the
# /_hooks/deploy location references it, so other sites are unaffected.
#
# Behind Cloudflare every request arrives from Cloudflare's addresses, so
# keying on the client address effectively limits the endpoint as a whole.
# That is what we want for a doorbell.
limit_req_zone $binary_remote_addr zone=lekkertech_hook:1m rate=1r/s;
