# lekkertech.org.za: reverse proxy vhost for the site.
# Installed at /etc/nginx/sites-available/lekkertech.org.za and symlinked into
# sites-enabled. Proxies to the Docker container published on 127.0.0.1:8801
# (see compose-production.yml).
#
# HTTP only on purpose. After enabling it, run certbot to add TLS:
#   certbot --nginx -d lekkertech.org.za -d www.lekkertech.org.za --redirect
# certbot adds the 443 server blocks and the HTTPS redirect itself, and then
# renews them like any other site.

server {
    listen 80;
    listen [::]:80;
    server_name lekkertech.org.za;

    # Deploy hook, proxied to the webhook daemon on loopback. On a live host
    # certbot has copied this block into a 443 one; the include belongs in
    # whichever block terminates TLS.
    include snippets/lekkertech-hook.conf;

    location / {
        proxy_pass http://127.0.0.1:8801;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CF-Connecting-IP and other request headers pass through untouched.
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.lekkertech.org.za;

    return 301 https://lekkertech.org.za$request_uri;
}
