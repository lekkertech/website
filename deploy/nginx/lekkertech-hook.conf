# Hooks: GitHub and the workflow -> Cloudflare -> nginx -> webhook daemon on
# loopback. Installed as /etc/nginx/snippets/lekkertech-hook.conf and included
# from the lekkertech.org.za server block that terminates TLS. Everything
# under /_hooks/ goes to the daemon, which serves /hooks/deploy (GitHub's
# Packages event) and /hooks/env (the workflow's environment delivery), so
# the site can serve anything except that prefix.
location ^~ /_hooks/ {
    limit_req zone=lekkertech_hook burst=5 nodelay;
    proxy_pass http://127.0.0.1:9000/hooks/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
